<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Dashboard</title>
  <meta name="description" content="A simple life dashboard to organize your day with a to-do list, focus timer, and quick links.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Header: greeting, clock, date -->
  <header id="header">
    <div class="header-top">
      <p id="greeting-text" class="greeting">Good Morning</p>
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark mode">
        <span id="theme-icon">🌙</span>
      </button>
    </div>
    <h1 id="clock" class="clock">00:00:00</h1>
    <p id="date-text" class="date-text">Loading date...</p>
    <div class="name-area">
      <span id="name-display" class="name-display"></span>
      <button id="edit-name-btn" class="edit-name-btn" aria-label="Edit name">✏️</button>
    </div>
  </header>

  <!-- Main dashboard grid -->
  <main class="dashboard">
    <!-- Focus Timer Card -->
    <section class="card timer-card" id="timer-section">
      <h2 class="card-title">🎯 Focus Timer</h2>
      <div class="timer-display" id="timer-display">25:00</div>
      <div class="timer-controls">
        <button id="timer-start" class="btn btn-primary">Start</button>
        <button id="timer-stop" class="btn btn-secondary" disabled>Stop</button>
        <button id="timer-reset" class="btn btn-outline">Reset</button>
      </div>
    </section>

    <!-- To-Do List Card -->
    <section class="card todo-card" id="todo-section">
      <h2 class="card-title">📝 To-Do List</h2>
      <form id="todo-form" class="todo-form">
        <input type="text" id="todo-input" class="todo-input" placeholder="What needs to be done?" autocomplete="off">
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
      <p id="duplicate-warning" class="duplicate-warning" hidden>⚠️ Task already exists!</p>
      <ul id="todo-list" class="todo-list"></ul>
    </section>

    <!-- Quick Links Card -->
    <section class="card links-card" id="links-section">
      <h2 class="card-title">🔗 Quick Links</h2>
      <form id="link-form" class="link-form">
        <input type="text" id="link-name" class="link-input" placeholder="Name (e.g. Google)" autocomplete="off">
        <input type="url" id="link-url" class="link-input" placeholder="URL (e.g. https://google.com)" autocomplete="off">
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
      <div id="links-container" class="links-container"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>

</html>
